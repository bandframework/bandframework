# conda / mamba environment for the demo notebook.  Mirrors pyproject.toml.
#
#     mamba env create -f environment.yml      # or: conda env create -f environment.yml
#     conda activate breakup-demo
#
# surmise is not on conda-forge, so it comes from pip.  numpy and scipy are
# pinned to the ranges surmise 0.4.0 accepts, so pip finds them already
# satisfied and does not try to replace conda's copies.
name: breakup-demo
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=2.1,<2.2
  - scipy>=1.14,<1.15
  - scikit-learn>=1.2
  - dill>=0.3.8
  - pytest                # surmise declares it as a runtime dependency
  - matplotlib>=3.9
  - corner>=2.2
  - jupyterlab>=4.0
  - ipykernel>=6.0
  - pip
  - pip:
      - surmise==0.4.0
